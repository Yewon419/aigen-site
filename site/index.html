<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>한예원 · SK AIGEN 1기 지원 포트폴리오</title>
<meta name="description" content="한예원 포트폴리오. 슈가캡, 템포루틴, 빛뜰 데스크, 짐살라빔과 AI와 일하는 방식.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aigen-site.vercel.app/">
<meta property="og:title" content="한예원 · SK AIGEN 1기 지원 포트폴리오">
<meta property="og:description" content="슈가캡, 템포루틴, 빛뜰 데스크, 짐살라빔과 AI와 일하는 방식.">
<meta property="og:image" content="https://aigen-site.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
  :root { --ink: #F5F5F7; --gray: #8E8E93; --rule: rgba(245,245,247,0.16); }
  html, body { margin: 0; background: #0D0D0F; color: var(--ink); font-family: 'Wanted Sans Variable', sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  a { color: inherit; }
  .ch { position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .links { position: absolute; display: flex; gap: 24px; }
  .links a { text-decoration: none; font-size: 15px; font-weight: 600; padding-bottom: 3px; border-bottom: 1px solid var(--ink); opacity: 0; transform: translateY(12px); white-space: nowrap; }

  /* 첫 화면: 왼쪽 이름, 오른쪽 목차 */
  #intro { height: 100vh; box-sizing: border-box; padding: 0 6.25vw; display: grid; grid-template-columns: 1fr minmax(0, 44vw); column-gap: 5vw; align-items: center; }
  .nm { margin: 0; font-size: clamp(64px, 11.5vw, 220px); font-weight: 900; letter-spacing: -0.05em; line-height: 1; }
  .nm span, .pf span { display: inline-block; }
  .mk { overflow: hidden; padding-bottom: 0.06em; }
  .pf { margin: 0.35em 0 0; font-size: clamp(24px, 2.6vw, 50px); font-weight: 700; letter-spacing: -0.02em; color: var(--gray); }
  .gh { display: inline-block; margin-top: 2.2em; font-size: 15px; font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
  .toc { list-style: none; margin: 0; padding: 0; }
  .toc li { display: grid; grid-template-columns: 1fr auto; column-gap: 24px; row-gap: 6px; padding: 20px 0; border-top: 1px solid var(--rule); }
  .toc li:last-child { border-bottom: 1px solid var(--rule); }
  .toc .nmc { font-size: clamp(20px, 1.6vw, 30px); font-weight: 800; letter-spacing: -0.02em; text-decoration: none; }
  .toc .ds { grid-column: 1; font-size: clamp(14px, 0.95vw, 17px); color: var(--gray); font-weight: 500; }
  .toc .lk { grid-column: 2; grid-row: 1 / span 2; align-self: center; display: flex; gap: 18px; }
  .toc .lk a { font-size: 15px; font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 2px; white-space: nowrap; }
  .toc .nmc:hover, .toc .lk a:hover, .gh:hover, .links a:hover { color: #fff; opacity: 0.75; }
  /* 들어올 때: 이름 글자는 마스크 아래에서 솟고, 목차 줄은 차례로 올라온다 */
  @keyframes rise { from { transform: translateY(105%); } to { transform: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .nm span { animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) both; }
  .pf span { animation: rise 0.8s cubic-bezier(0.16,1,0.3,1) 0.35s both; }
  .gh { animation: up 0.7s cubic-bezier(0.16,1,0.3,1) 0.6s both; }  .toc li { animation: up 0.7s cubic-bezier(0.16,1,0.3,1) both; }
  /* 목차가 서기 전, 같은 자리에서 프로젝트 이름이 하나씩 솟았다 빠진다 */
  .rt { position: relative; }
  #tk { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); pointer-events: none; }
  #tk .tn { position: absolute; left: 0; top: 0; transform: translateY(-50%); overflow: hidden; white-space: nowrap; padding-bottom: 0.06em;
    font-size: clamp(48px, 6.4vw, 124px); font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; }
  #tk .tn span { display: inline-block; transform: translateY(105%); }
  @keyframes tkin { from { transform: translateY(105%); } to { transform: none; } }
  @keyframes tkout { from { transform: none; } to { transform: translateY(-105%); } }
  @media (max-aspect-ratio: 1/1) {
    #intro { grid-template-columns: 1fr; align-content: center; row-gap: 44px; padding: 0 34px; }
    .nm { font-size: 80px; }
    .pf { font-size: 26px; }
    .gh { margin-top: 1.2em; }
    .toc li { padding: 14px 0; }
    .toc .nmc { font-size: 20px; }
    .toc .ds { font-size: 13px; grid-column: 1 / -1; grid-row: 2; }
    .toc .lk { gap: 14px; grid-row: 1; }
    .toc .lk a { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .nm span, .pf span, .gh, .toc li { animation: none; } #tk { display: none; } }
</style>
</head>
<body>
<section id="intro">
  <div>
    <h1 class="nm mk"><span>한</span><span>예</span><span>원</span></h1>
    <p class="pf mk"><span>Portfolio</span></p>
    <a class="gh" href="https://github.com/Yewon419" target="_blank" rel="noopener">github.com/Yewon419</a>
  </div>
  <div class="rt"><div id="tk" aria-hidden="true"></div><ul class="toc" id="toc"></ul></div>
</section>
<main id="main"></main>
<script>
// 장 파일의 seek(t)를 스크롤 위치로 직접 부른다. 구운 그림이 없어 어느 해상도에서도 선명하다
const CH = [
  { id: 'sugar', name: '슈가캡', desc: '당·카페인을 즐겁게 줄이는 iOS 앱, 1인 개발', dur: 17, at: [1280, 860], links: [['App Store', 'https://apps.apple.com/kr/app/id6814832068'], ['GitHub', 'https://github.com/Yewon419/sugarcap']] },
  { id: 'tempo', name: '템포루틴', desc: '생리 주기에 맞춰 한 달을 짜는 iOS 플래너, 1인 개발', dur: 20, at: [1400, 620], links: [['App Store', 'https://apps.apple.com/kr/app/id6791803620'], ['GitHub', 'https://github.com/Yewon419/TempoRoutine']] },
  { id: 'desk', name: '빛뜰 데스크', desc: 'Claude Code 세션 관리 웹 대시보드, 1인 개발', dur: 18, at: [1400, 790], links: [['GitHub', 'https://github.com/Yewon419/bitteul-desk']] },
  { id: 'gim', name: '짐살라빔', desc: '웹캠으로 스쿼트·댄스 자세를 채점하는 웹, 4인 팀', dur: 15.5, at: [1400, 520], links: [['판넬 PDF', '/assets/gimsalabim-panel.pdf']] },
  { id: 'method', name: 'AI와 일하는 방식', desc: '스펙부터 화면 검수까지, 만드는 공정', dur: 14, at: [1400, 520], links: [['GitHub', 'https://github.com/Yewon419/aigen-site']] },
];
const VH_PER_SEC = matchMedia('(pointer: coarse)').matches ? 38 : 50;   // 영상 1초에 드는 스크롤 거리. 터치는 짧게
const TAU = 0.14;   // 재생 위치가 스크롤 위치를 따라붙는 시간 상수(초)
const V = '6';   // 장 파일을 고치면 올린다. 브라우저가 옛 장 파일을 캐시에서 꺼내 쓰지 않게
const portrait = () => innerHeight > innerWidth;
let PORT = portrait();
const main = document.getElementById('main');
const toc = document.getElementById('toc');
const ext = (h) => (h.startsWith('http') || h.endsWith('.pdf') ? ' target="_blank" rel="noopener"' : '');

// 인트로: 이름이 선 뒤 프로젝트 이름이 목차 자리에서 차례로 솟았다 빠지고, 마지막이 빠질 때 목차가 올라온다
// 나가는 단어는 다음 단어가 솟는 순간 같은 곡선으로 함께 밀려 올라간다(글자 지연은 들어오는 쪽만 둬서 둘이 겹치지 않는다)
const TK0 = 0.6, TK_GAP = 0.5, TK_DUR = 0.45, TK_STAG = 0.03;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tk = document.getElementById('tk');
const TOC0 = calm ? 0 : TK0 + CH.length * TK_GAP + 0.1;
CH.forEach((c, i) => {
  const tn = document.createElement('div'); tn.className = 'tn';
  const glyphs = [...c.name];
  tn.innerHTML = glyphs.map((g) => `<span>${g === ' ' ? '&nbsp;' : g}</span>`).join('');
  [...tn.children].forEach((s, j) => {
    const tin = TK0 + i * TK_GAP + j * TK_STAG, tout = TK0 + (i + 1) * TK_GAP;
    s.style.animation = `tkin ${TK_DUR}s cubic-bezier(0.16,1,0.3,1) ${tin}s forwards, tkout ${TK_DUR}s cubic-bezier(0.16,1,0.3,1) ${tout}s forwards`;
  });
  tk.append(tn);
});
// 긴 이름은 칸 폭에 맞게 줄인다
const fitTicker = () => [...tk.children].forEach((tn) => { tn.style.fontSize = ''; const w = tk.clientWidth; if (tn.scrollWidth > w) tn.style.fontSize = (parseFloat(getComputedStyle(tn).fontSize) * w / tn.scrollWidth) + 'px'; });
document.fonts.ready.then(fitTicker);
addEventListener('resize', fitTicker);
setTimeout(() => tk.remove(), (TOC0 + 1) * 1000);

CH.forEach((c, i) => {
  const li = document.createElement('li'); li.style.animationDelay = (TOC0 + i * 0.07) + 's';
  li.innerHTML = `<a class="nmc" href="#${c.id}">${c.name}</a><span class="ds">${c.desc}</span><span class="lk">${c.links.map(([t, h]) => `<a href="${h}"${ext(h)}>${t}</a>`).join('')}</span>`;
  li.querySelector('.nmc').addEventListener('click', (e) => { e.preventDefault(); go(c.rest.length ? c.rest[0] : c.sec.offsetTop); });
  toc.append(li);

  const sec = document.createElement('section'); sec.className = 'ch'; sec.id = c.id;
  sec.style.height = `${c.dur * VH_PER_SEC + 100}vh`;
  sec.innerHTML = `<div class="stage"><iframe tabindex="-1" title="${c.name}"></iframe><nav class="links">${c.links.map(([t, h]) => `<a href="${h}"${ext(h)}>${t}</a>`).join('')}</nav></div>`;
  main.append(sec);
  c.sec = sec; c.fr = sec.querySelector('iframe'); c.nav = sec.querySelector('.links'); c.as = [...c.nav.children];
  c.cur = -1; c.shown = -1; c.ready = false; c.holds = []; c.rest = [];
  c.fr.addEventListener('load', () => {
    c.ready = false;
    const wait = () => (typeof c.fr.contentWindow.seek === 'function' ? (findHolds(c), c.ready = true, c.shown = -1, kick()) : requestAnimationFrame(wait));
    wait();
  });
});
const load = () => CH.forEach((c) => { c.ready = false; c.holds = []; c.rest = []; c.fr.src = `/film/${c.id}.html?v=${V}${PORT ? '&p' : ''}`; });

// 정지 지점: 장면 글이 전부 떠 있고 막 나가기 직전인 순간. seek로 훑으며 다 올라온 낱말 수를 세고,
// 그 수가 줄기 시작하는 시각(나가는 물결의 첫 칸)을 잡는다. 장 끝(링크가 뜨는 자리)도 하나
const STEP = 0.05;
function findHolds(c) {
  const w = c.fr.contentWindow, d = c.fr.contentDocument;
  const ws = [...d.querySelectorAll('.w')], gs = [...d.querySelectorAll('.g')];
  const full = () => ws.filter((e) => (e.style.opacity === '' || +e.style.opacity > 0.99) && !e.style.filter.includes('blur')).length
    + gs.filter((e) => e.style.transform.includes('translateY(0px)')).length;
  const n = Math.round(c.dur / STEP);
  const v = [];
  for (let i = 0; i <= n; i++) { w.seek(Math.min(c.dur, i * STEP)); v.push(full()); }
  const holds = [];
  let lastDrop = -9;
  for (let i = 0; i < n; i++) {
    if (v[i + 1] >= v[i]) continue;
    const t = i * STEP;
    if (t - lastDrop > 0.6 && v[i] > 0) holds.push(t);
    lastDrop = t;
  }
  holds.push(c.dur);
  c.holds = holds;
  place();
}
function place() {
  CH.forEach((c) => {
    const top = c.sec.offsetTop, span = c.sec.offsetHeight - innerHeight;
    c.rest = c.holds.map((t) => Math.round(top + (t / c.dur) * span));
  });
}
const rests = () => [0, ...CH.flatMap((c) => c.rest)].sort((a, b) => a - b);

function resize() {
  const p = portrait();
  if (p !== PORT) { PORT = p; load(); }
  const SW = PORT ? 1080 : 1920, SH = PORT ? 1920 : 1080;
  const k = Math.min(innerWidth / SW, innerHeight / SH);
  const ox = (innerWidth - SW * k) / 2, oy = (innerHeight - SH * k) / 2;
  CH.forEach((c) => {
    c.fr.style.width = SW + 'px'; c.fr.style.height = SH + 'px';
    c.fr.style.transform = `translate(${ox}px, ${oy}px) scale(${k})`;
    if (PORT) {
      // 세로: 무대 아래 남는 띠에 링크를 둔다. 띠가 좁으면 무대 아랫단에 겹친다
      c.nav.style.left = (ox + 100 * k) + 'px';
      c.nav.style.top = (oy >= 44 ? oy + SH * k + 12 : oy + (SH - 70) * k) + 'px';
    } else {
      c.nav.style.left = (ox + c.at[0] * k) + 'px'; c.nav.style.top = (oy + c.at[1] * k) + 'px';
    }
  });
  place();
  kick();
}

const target = (c) => {
  const top = c.sec.offsetTop, span = c.sec.offsetHeight - innerHeight;
  return Math.min(1, Math.max(0, (scrollY - top) / span)) * c.dur;
};
const near = (c) => scrollY > c.sec.offsetTop - innerHeight && scrollY < c.sec.offsetTop + c.sec.offsetHeight;

let raf = 0, last = 0;
function frame(now) {
  raf = 0;
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 1 / 60; last = now;
  let moving = false;
  CH.forEach((c) => {
    if (!near(c)) { c.cur = -1; return; }
    const g = target(c);
    // 처음 보이거나 멀리 건너뛰면 바로 맞추고, 아니면 지수 감쇠로 따라붙는다
    if (c.cur < 0 || Math.abs(g - c.cur) > 4) c.cur = g;
    else c.cur += (g - c.cur) * (1 - Math.exp(-dt / TAU));
    if (Math.abs(g - c.cur) < 0.002) c.cur = g; else moving = true;
    const t = +c.cur.toFixed(4);
    if (c.ready && t !== c.shown) { c.fr.contentWindow.seek(t); c.shown = t; }
    const p = c.cur / c.dur;
    c.as.forEach((a, i) => {
      const e = 1 - Math.pow(1 - Math.min(1, Math.max(0, (p - 0.94 - i * 0.012) / 0.03)), 4);
      a.style.opacity = e; a.style.transform = `translateY(${12 * (1 - e)}px)`;
      a.style.pointerEvents = e > 0.5 ? 'auto' : 'none';
    });
  });
  if (moving) kick(); else last = 0;
}
function kick() { if (!raf) raf = requestAnimationFrame(frame); }

// 스냅: 스크롤이 멈추면 움직이던 방향의 다음 정지 지점까지 넘어간다. 글이 바뀌는 중간에는 서지 않는다
const IDLE = 160;
let anim = null, idle = 0, dir = 1, lastY = scrollY, touching = false;
const inOut = (x) => (1 - Math.cos(Math.PI * x)) / 2;
// 점프(목차)는 거리만큼 짧게, 스냅은 그 사이 장면이 제 속도로 재생되는 시간만큼
const jumpMs = (d) => Math.min(1100, Math.max(420, 380 + (Math.abs(d) / innerHeight) * 160));
const PLAY_RATE = 1;   // 스냅 중 재생 배속
const playMs = (d) => Math.min(4500, Math.max(500, (Math.abs(d) / (innerHeight * VH_PER_SEC / 100)) * 1000 / PLAY_RATE));
function go(y, msFor = jumpMs) {
  y = Math.max(0, Math.min(document.documentElement.scrollHeight - innerHeight, y));
  const y0 = scrollY, d = y - y0;
  if (Math.abs(d) < 2) return;
  const dur = msFor(d);
  const t0 = performance.now();
  const id = {};
  anim = id;
  const step = (now) => {
    if (anim !== id) return;
    const u = Math.min(1, (now - t0) / dur);
    scrollTo(0, y0 + d * inOut(u));
    if (u < 1) requestAnimationFrame(step); else anim = null;
  };
  requestAnimationFrame(step);
}
function snap() {
  if (anim || touching) return;
  const y = scrollY, R = rests();
  if (R.some((r) => Math.abs(r - y) < 3)) return;
  const next = R.find((r) => r > y), prev = [...R].reverse().find((r) => r < y);
  const to = dir > 0 ? (next ?? prev) : (prev ?? next);
  if (to !== undefined) go(to, playMs);
}
const cancel = () => { anim = null; };
addEventListener('wheel', cancel, { passive: true });
addEventListener('touchstart', () => { touching = true; cancel(); }, { passive: true });
addEventListener('touchend', () => { touching = false; clearTimeout(idle); idle = setTimeout(snap, IDLE); }, { passive: true });
addEventListener('keydown', cancel);
addEventListener('scroll', () => {
  kick();
  const y = scrollY;
  if (y !== lastY) dir = y > lastY ? 1 : -1;
  lastY = y;
  if (anim) return;
  clearTimeout(idle); idle = setTimeout(snap, IDLE);
}, { passive: true });
addEventListener('resize', resize);
load();
resize();
</script>
</body>
</html>
